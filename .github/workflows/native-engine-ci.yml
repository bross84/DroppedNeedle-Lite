name: Native Engine CI

# Fast, targeted gates for the native library + download engine.
#
# This workflow deliberately does NOT run the full backend suite, ruff, or any
# frontend check: backend-ci.yml and frontend-ci.yml already do, and running
# them here too meant the entire ~80 minute backend suite executed twice on
# every pull request, doubling the compute and giving two chances for the same
# flaky test to turn a PR red.
#
# What is left are the two subsets worth reporting on their own: they finish in
# under a minute and name the failure precisely, instead of being buried in a
# full-suite run that takes an hour longer to say the same thing.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/native-engine-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/native-engine-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (mock slskd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      # Mock-only e2e. The real-slskd container test (-m e2e) is opt-in: it needs a
      # provisioned slskd (API key / shared folders) and self-skips otherwise.
      - name: E2E (mock-only)
        run: python -m pytest tests/e2e tests/infrastructure/test_e2e_download.py -m "not e2e"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Security tests (no-secrets-in-logs, auth matrix, api-key masking)
        run: python -m pytest tests/security
