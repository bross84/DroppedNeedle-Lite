name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff
        run: ruff check backend

  test:
    name: Tests
    runs-on: ubuntu-latest
    # The full suite legitimately runs ~80 minutes, so this ceiling is generous
    # on purpose - it exists to stop a hung run burning GitHub's 6 hour default,
    # not to police the normal duration. Lower it only alongside a real speedup.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      # One benchmark (test_115000_review_cursor_...) was 4306s of a 4808s run -
      # 90% of CI, versus 16.6s for the same test locally. It seeds 230,000 rows,
      # so runner storage dominates it; every other test times the same in both
      # environments. Skipping it on pull requests takes this job from ~80
      # minutes to ~8 while still running it on every merge to main, so a real
      # regression in it is caught before it ships, just not on every push.
      - name: Run tests (pull request)
        if: github.event_name == 'pull_request'
        run: python -m pytest -m "not slow" --durations=25

      - name: Run tests (main, including slow benchmarks)
        if: github.event_name != 'pull_request'
        run: python -m pytest --durations=25
