name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'pyproject.toml'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff
        run: ruff check backend

  test:
    name: Tests
    runs-on: ubuntu-latest
    # The full suite legitimately runs ~80 minutes, so this ceiling is generous
    # on purpose - it exists to stop a hung run burning GitHub's 6 hour default,
    # not to police the normal duration. Lower it only alongside a real speedup.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      # --durations prints the slowest tests at the end of the run. The same
      # suite takes ~10 minutes locally and ~85 here, and the setup steps
      # account for 19 seconds of that, so the gap is inside pytest itself.
      # Comparing this list against the local one separates a uniform slowdown
      # (disk/CPU) from specific tests stalling (network timeouts).
      - name: Run tests
        run: python -m pytest --durations=25
